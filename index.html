<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper and scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class = "header">
        <h1 class = "title">Rock, Paper, and Scissors</h1>
    </div>
    <div class = "result">
        <div class = "score">
            <div class = "player">
                <p class = "title">PLAYER</p>
                <p class = "player-score">0</p>
            </div>
            <p class = "dash">-</p>
            <div class = "computer">
                <p class = "title">COMPUTER</p>
                <p class = "computer-score">0</p>
            </div>
        </div>
        <p class = "announcer">insert the round result</p>
    </div>
    <div class = "player-choice">
        <button class = "rock">ROCK</button>
        <button class = "paper">PAPER</button>
        <button class = "scissors">SCISSORS</button>
    </div>
    <div class = "match-history">
        <div class = "player">
            <p class = "title">PLAYER</p>
            <ul class = "player-choices">
                
            </ul>
        </div>
        <div class = "computer">
            <p class = "title">COMPUTER</p>
            <ul class = "computer-choices">
                
            </ul>
        </div>
    </div>
</body>
</html>
